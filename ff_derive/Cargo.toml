[package]
name = "ff-derive-arcium-fork"
description = "Procedural macro library used to build custom prime field implementations (Arcium fork)"
version = "0.14.0-pre.0"
edition = "2021"
license = "MIT/Apache-2.0"
homepage = "https://www.arcium.com"
repository = "https://github.com/arcium-hq/ff"
documentation = "https://docs.rs/ff-derive/"

[features]
# enabled when generating bitvec code utilizing the version of ff's bitvec
# ff/bits enables this
bits = []

[lib]
proc-macro = true

[dependencies]
addchain = { package = "addchain-arcium-fork", version = "0.2.1" }
num-bigint = "0.4.6"
num-traits = "0.2"
num-integer = "0.1"
proc-macro2 = "1"
quote = "1"
syn = { version = "1", features = ["full"] }

[badges]
maintenance = { status = "passively-maintained" }
